<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3s5vj | Anime Glitch Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* خلفية سوداء بالكامل مبرمجة بتأثيرات أنمي و Glitch متحرك */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000000; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* التأثير الأول: خطوط المانجا العمودية المتحركة (مثل الفيديو الذي أرسلته) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, 
                transparent 45%, 
                rgba(255,255,255,0.15) 49%, 
                rgba(255,255,255,0.25) 50%, 
                rgba(255,255,255,0.15) 51%, 
                transparent 55%);
            background-size: 150px 100%;
            animation: mangaLines 1.2s steps(6) infinite;
            z-index: 0;
            opacity: 0.6;
        }

        /* التأثير الثاني: ومضات الخلل الرقمي والـ Glitch السريع في الخلفية */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.03);
            z-index: 0;
            animation: glitchOverlay 0.4s infinite;
            pointer-events: none;
        }

        /* الكارت الأوسط شفاف تماماً بدون خلفية ليظهر تأثير الأنمي خلفه */
        .container {
            position: relative;
            z-index: 2; 
            background: transparent; 
            padding: 40px 30px 15px 30px; 
            text-align: center;
            width: 85%;
            max-width: 340px;
        }

        .profile-area {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .user-circle {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            background: rgba(0,0,0,0.6); 
        }

        .user-circle i {
            font-size: 45px;
            color: #ffffff;
        }

        .shimmer-wrapper {
            display: inline-block;
            position: relative;
            overflow: hidden;
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        /* عنوان CONNECT WITH ME بحركة هادئة بين الأبيض والأسود */
        .official-title {
            display: block;
            margin-bottom: 35px;
            font-size: 21px;
            letter-spacing: 1.5px;
            background-image: linear-gradient(to right, #111111 0%, #ffffff 50%, #111111 100%);
            animation: textShimmerAnime 6s infinite linear;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
            border: none;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: inherit;
            pointer-events: none; 
            opacity: 0;
            transition: all 0.2s ease;
        }

        .btn-insta {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        .btn-insta:active::after {
            background: rgba(220, 39, 67, 0.8);
            animation: flashNeon 0.3s ease-out;
            opacity: 1;
        }

        .btn-tiktok {
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-tiktok:active::after {
            background: rgba(255, 255, 255, 0.6);
            animation: flashNeon 0.3s ease-out;
            opacity: 1;
        }

        .btn-discord {
            background: #5865F2;
        }
        .btn-discord:active::after {
            background: rgba(88, 101, 242, 0.8);
            animation: flashNeon 0.3s ease-out;
            opacity: 1;
        }

        @keyframes flashNeon {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .footer {
            font-size: 13px;
            color: #bbb;
            margin-top: 35px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* التأثير الذهبي الفخم للوصول المميز */
        .gold-feature {
            display: block;
            margin-top: 10px;
            font-size: 15px;
            background-image: linear-gradient(to right, #d4af37 0%, #ffffff 50%, #d4af37 100%);
            animation: textShimmerGold 4s infinite linear;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        }

        /* حركات الأنيميشن المبرمجة بالكامل */
        @keyframes mangaLines {
            0% { background-position: 0px 0; }
            100% { background-position: 300px 0; }
        }

        @keyframes glitchOverlay {
            0% { background: rgba(255,255,255,0.01); }
            50% { background: rgba(255,255,255,0.04); transform: skewX(1deg); }
            100% { background: rgba(255,255,255,0.01); }
        }

        @keyframes textShimmerAnime {
            0% { background-position: -100% center; }
            100% { background-position: 100% center; }
        }

        @keyframes textShimmerGold {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
    </style>
</head>
