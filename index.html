<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3s5vj</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a0f0a; /* بني غامق فخم */
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            background: rgba(43, 29, 23, 0.7);
            backdrop-filter: blur(15px);
            padding: 40px 30px 15px 30px; 
            border-radius: 30px;
            text-align: center;
            width: 85%;
            max-width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .profile-area {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .user-circle {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            background: rgba(0,0,0,0.4);
        }

        .user-circle i {
            font-size: 45px;
            color: #ffffff;
        }

        /* الكلاس المشترك المسؤول عن تأثير اللمعان الحركي الأصلي */
        .shimmer-wrapper {
            display: inline-block;
            position: relative;
            overflow: hidden;
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        /* تم تطبيق الأنيميشن والمؤثر الحركي هنا مع الحفاظ على اللون الأبيض الأصلي للكلمة */
        .official-title {
            display: block;
            margin-bottom: 35px;
            font-size: 21px;
            letter-spacing: 1.5px;
            background-image: linear-gradient(to right, #ffffff 0%, #a8a8a8 50%, #ffffff 100%);
            animation: textShimmerGold 2s infinite linear;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
            border: none;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-insta {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .btn-tiktok {
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-discord {
            background: #5865F2;
        }

        .footer {
            font-size: 13px;
            color: #aaa;
            margin-top: 35px;
        }

        /* حركة الوميض الذهبية الأصلية لـ وصول مميز */
        .gold-feature {
            display: block;
            margin-top: 10px;
            font-size: 15px;
            background-image: linear-gradient(to right, #d4af37 0%, #ffffff 50%, #d4af37 100%);
            animation: textShimmerGold 2s infinite linear;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* حركة اللمعان الموحدة */
        @keyframes textShimmerGold {
            0% { background-position: -100% center; }
            100% { background-position: 100% center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-area">
            <div class="user-circle">
                <i class="fas fa-user"></i>
            </div>
        </div>

        <span class="official-title shimmer-wrapper">CONNECT WITH ME</span>

        <div class="links">
            <a href="https://www.instagram.com/3s5vj" class="btn btn-insta" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://www.tiktok.com/@3s5vj" class="btn btn-tiktok" target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="https://discord.com/users/i15.1" class="btn btn-discord" target="_blank">
                <i class="fab fa-discord"></i> Discord
            </a>
        </div>

        <div class="footer">
             اضغط للمتابعة
             <span class="gold-feature shimmer-wrapper">✨ وصول مميز ✨</span>
        </div>
    </div>

</body>
</html>
