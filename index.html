<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3s5vj</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #050505;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* ===== خلفية ضبابية غامضة متحركة ===== */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 {
            width: 420px; height: 420px;
            background: radial-gradient(circle, #4a4a4a, transparent 70%);
            top: -120px; left: -120px;
            animation: drift1 14s ease-in-out infinite alternate;
        }
        .glow-2 {
            width: 380px; height: 380px;
            background: radial-gradient(circle, #1f1f2e, transparent 70%);
            bottom: -100px; right: -100px;
            animation: drift2 17s ease-in-out infinite alternate;
        }
        .glow-3 {
            width: 260px; height: 260px;
            background: radial-gradient(circle, #2b2b3a, transparent 70%);
            bottom: 20%; left: 15%;
            animation: drift1 20s ease-in-out infinite alternate-reverse;
        }
        @keyframes drift1 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.15); }
        }
        @keyframes drift2 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-70px, -50px) scale(1.2); }
        }

        /* جزيئات خفيفة كالغبار */
        .particles span {
            position: fixed;
            width: 3px; height: 3px;
            background: rgba(255,255,255,0.35);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }

        /* ===== الحاوية ===== */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(12, 12, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 30px 20px 30px;
            border-radius: 24px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 1px solid rgba(255, 60, 0, 0.15);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(255, 45, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* الإطار الناري المتحرك حول البطاقة */
        .container::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            padding: 2px;
            background: conic-gradient(
                from var(--angle),
                rgba(217, 0, 0, 0) 0%,
                #d90000 12%,
                #ff4500 20%,
                #ffb300 26%,
                rgba(255, 179, 0, 0) 40%,
                rgba(217, 0, 0, 0) 60%,
                #ff4500 75%,
                #ffb300 82%,
                rgba(255, 179, 0, 0) 95%
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            animation: rotateAngle 5s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateAngle {
            to { --angle: 360deg; }
        }

        .container::before {
            content: "";
            position: absolute;
            top: -1px; left: 10%;
            width: 80%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            animation: topLine 3s ease-in-out infinite;
        }
        @keyframes topLine {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 1; }
        }

        /* ===== الصورة الشخصية ===== */
        .profile-area {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
            position: relative;
        }

        .user-circle {
            width: 96px; height: 96px;
            border-radius: 50%;
            position: relative;
        }

        .fire-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(#d90000, #ff4500, #ffb300, #5a0a0a, #d90000);
            animation: spinBorder 3s linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 60, 0, 0.45));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }
        @keyframes spinBorder {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .user-inner {
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            overflow: hidden;
            background: #0c0c0e;
        }

        .user-inner img {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center 25%;
            display: block;
            position: relative;
            z-index: 1;
        }

        /* ===== الاسم / العنوان ===== */
        .shimmer-wrapper {
            display: inline-block;
            position: relative;
            overflow: hidden;
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .official-title {
            display: block;
            margin-bottom: 8px;
            font-size: 28px;
            letter-spacing: 3px;
            background-image: linear-gradient(to right, #d90000 0%, #ff4500 30%, #ffb300 50%, #ff4500 70%, #d90000 100%);
            background-size: 200% auto;
            animation: fireShimmer 2.2s infinite linear;
            filter: drop-shadow(0 0 10px rgba(255, 45, 0, 0.6)) drop-shadow(0 0 28px rgba(255, 0, 0, 0.35));
        }

        @keyframes fireShimmer {
            0%   { background-position: -100% center; }
            100% { background-position: 100% center; }
        }

        .title-fire {
            position: relative;
            display: inline-block;
        }

        .fire-zone .ember {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle, #ffd27a 0%, #ff6a00 55%, rgba(255, 0, 0, 0) 75%);
            animation: emberRise linear forwards;
            filter: blur(0.4px);
        }

        @keyframes emberRise {
            0%   { transform: translate(0, 0) scale(1); opacity: 1; }
            60%  { opacity: 0.9; }
            100% { transform: translate(var(--dx, 0px), -70px) scale(0.2); opacity: 0; }
        }

        .subtitle {
            position: relative;
            display: block;
            margin-bottom: 30px;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            background-image: linear-gradient(to right, #ff5e3a 0%, #ffcf7a 50%, #ff5e3a 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fireShimmer 2.2s infinite linear;
            filter: drop-shadow(0 0 8px rgba(255, 110, 40, 0.55)) drop-shadow(0 0 22px rgba(255, 60, 0, 0.3));
        }

        /* ===== الأزرار ===== */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #d8d8d8;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .btn::after {
            content: "";
            position: absolute;
            top: 0; left: -80%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transition: none;
        }
        .btn:hover::after {
            animation: sweep 0.7s ease;
        }
        @keyframes sweep {
            0%   { left: -80%; }
            100% { left: 130%; }
        }

        .btn:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        .btn:active { transform: scale(0.96); }

        .btn i:first-child { font-size: 19px; }
        .btn .arrow { font-size: 13px; opacity: 0.5; transition: all 0.3s ease; }
        .btn:hover .arrow { opacity: 1; transform: translateX(-4px); }

        .btn .label { flex: 1; text-align: center; }

        .btn-insta:hover {
            border-color: rgba(220, 39, 102, 0.6);
            box-shadow: 0 0 20px rgba(188, 24, 136, 0.25);
        }
        .btn-tiktok:hover {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
        }
        .btn-discord:hover {
            border-color: rgba(88, 101, 242, 0.6);
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.25);
        }

        /* ===== التذييل ===== */
        .footer {
            font-size: 12px;
            color: #666;
            margin-top: 32px;
            letter-spacing: 1px;
        }

        .press-line {
            position: relative;
            display: block;
            margin-top: 8px;
            font-size: 13px;
            letter-spacing: 1px;
            background-image: linear-gradient(to right, #d90000 0%, #ff4500 30%, #ffb300 50%, #ff4500 70%, #d90000 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fireShimmer 2.2s infinite linear;
            filter: drop-shadow(0 0 6px rgba(255, 45, 0, 0.5)) drop-shadow(0 0 16px rgba(255, 0, 0, 0.25));
        }

        .gold-feature {
            position: relative;
            display: inline-block;
            margin-top: 8px;
            font-size: 14px;
            letter-spacing: 1px;
            background-image: linear-gradient(to right, #d90000 0%, #ff4500 30%, #ffb300 50%, #ff4500 70%, #d90000 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fireShimmer 2.2s infinite linear;
            filter: drop-shadow(0 0 8px rgba(255, 45, 0, 0.55)) drop-shadow(0 0 20px rgba(255, 0, 0, 0.3));
        }

        @media (max-width: 380px) {
            .container { padding: 35px 20px 15px 20px; }
        }
    </style>
</head>
<body>

    <!-- توهجات الخلفية -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-glow glow-3"></div>

    <!-- جزيئات متحركة -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="profile-area">
            <div class="user-circle">
                <div class="fire-ring"></div>
                <div class="user-inner">
                    <img src="https://i.postimg.cc/jjXKydtT/IMG-8357.jpg" alt="avatar">
                </div>
            </div>
        </div>

        <div class="title-fire" id="titleFire">
            <span class="official-title shimmer-wrapper">𝑵𝒖𝑳𝑳</span>
        </div>
        <span class="subtitle fire-zone" id="subtitleFire">CONNECT WITH ME</span>

        <div class="links">
            <a href="https://www.instagram.com/3s5vj" class="btn btn-insta" target="_blank">
                <i class="fab fa-instagram"></i>
                <span class="label">Instagram</span>
                <i class="fas fa-chevron-left arrow"></i>
            </a>
            <a href="https://www.tiktok.com/@3s5vj" class="btn btn-tiktok" target="_blank">
                <i class="fab fa-tiktok"></i>
                <span class="label">TikTok</span>
                <i class="fas fa-chevron-left arrow"></i>
            </a>
            <a href="https://www.discord.com/users/1421180443654488074" class="btn btn-discord" target="_blank">
                <i class="fab fa-discord"></i>
                <span class="label">Discord</span>
                <i class="fas fa-chevron-left arrow"></i>
            </a>
        </div>

        <div class="footer">
            <span class="press-line fire-zone" id="pressFire">اضغط للمتابعة</span>
            <span class="gold-feature fire-zone" id="footerFire">✦ وصول مميز ✦</span>
        </div>
    </div>

    <script>
        const particles = document.getElementById('particles');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('span');
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-10px';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            p.style.opacity = 0.15 + Math.random() * 0.4;
            const size = 1 + Math.random() * 2.5;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            particles.appendChild(p);
        }

        function spawnEmber(container) {
            const e = document.createElement('span');
            e.className = 'ember';
            const size = 2 + Math.random() * 4;
            e.style.width = size + 'px';
            e.style.height = size + 'px';
            e.style.left = (5 + Math.random() * 90) + '%';
            e.style.bottom = (Math.random() * 8) + 'px';
            e.style.setProperty('--dx', (Math.random() * 30 - 15) + 'px');
            e.style.animationDuration = (1.2 + Math.random() * 1.2) + 's';
            container.appendChild(e);
            setTimeout(() => e.remove(), 2600);
        }

        const titleFire = document.getElementById('titleFire');
        const subtitleFire = document.getElementById('subtitleFire');
        const footerFire = document.getElementById('footerFire');
        const pressFire = document.getElementById('pressFire');
        setInterval(() => spawnEmber(titleFire), 160);
        spawnEmber(titleFire);
        setInterval(() => spawnEmber(subtitleFire), 450);
        spawnEmber(subtitleFire);
        setInterval(() => spawnEmber(footerFire), 380);
        spawnEmber(footerFire);
        setInterval(() => spawnEmber(pressFire), 380);
        spawnEpressFire = pressFire;
        setInterval(() => spawnEmber(pressFire), 380);
    </script>

</body>
</html>
